<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<!-- Open Graph / link preview cards. og:url intentionally omitted until the
     site has a permanent domain — add it once deployed. -->

<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cover" data-root="">

<div class="monitor">
  <div class="screen-frame" id="screenFrame">

    <!-- the screen: one stage per page -->
    <div class="screen" id="screen">
      <div class="crt-content" id="content">
        <div id="stage-boot"></div>

        <div id="stage-intro">
          <div class="title glow-strong">CREATIVE<br>PORTFOLIO</div>
          <div class="subtitle">// Luka Biniashvili</div>
          <div class="meta-line glow"><span class="meta-label">ITEMS&gt;</span> 13 selected works</div>
          <div class="prompt-line glow-strong">PRESS <span class="dim">[ ENTER ]</span> TO CONTINUE<span class="cursor-block"></span></div>
        </div>
      </div>
    </div>

    <!-- layers drawn above the text -->
    <canvas class="crt-canvas" id="crtCanvas"></canvas>
    <div class="curve-overlay"></div>
    <div class="now-viewing" id="nowViewing"></div>
    <div class="skip-hint" id="skipHint">click screen or press any key</div>
  </div>

  <!-- numbered channel buttons, built by js/main.js -->
  <div class="channel-bar" id="channelBar"></div>
</div>

<script src="js/data.js"></script>
<script src="js/crt.js"></script>
<script src="js/main.js"></script>
</body>
</html>
